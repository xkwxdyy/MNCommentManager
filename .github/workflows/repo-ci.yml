name: Independent source and package checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the pinned package manager without lifecycle hooks
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org pnpm@10.34.7
      - name: Install frozen dependencies without lifecycle hooks
        run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - name: Run the reviewed explicit source checks
        run: node ci/run-checks.mjs ci/commands.json
      - name: Build and verify a local candidate without changing source inputs
        run: python3 ci/build-candidate.py
